name: Sprawdzenie

on:
  push:
  pull_request:

jobs:
  motywy-i-instalator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Składnia skryptów PowerShell
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Motywy zgodne ze schematem
        shell: pwsh
        run: |
          python -m pip install --quiet jsonschema pyyaml
          python -c "import json,glob,jsonschema,sys; s=json.load(open('themes/schema.json',encoding='utf-8')); bad=0
          for f in glob.glob('themes/*.json'):
              if f.endswith('schema.json'): continue
              t=json.load(open(f,encoding='utf-8'))
              for e in jsonschema.Draft7Validator(s).iter_errors(t): print(f'::error file={f}::{e.message}'); bad+=1
              if t.get('id')+'.json'!=f.replace('\\','/').split('/')[-1]: print(f'::error file={f}::id musi być taki jak nazwa pliku'); bad+=1
          sys.exit(bad>0)"

      - name: Próbne zastosowanie motywów (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Get-ChildItem themes -Filter *.json | Where-Object Name -ne 'schema.json' | ForEach-Object {
            & .\installer\prism.ps1 apply $_.BaseName -DryRun -OutDir "out\ps5\$($_.BaseName)"
          }

      - name: Próbne zastosowanie motywów (PowerShell 7)
        shell: pwsh
        run: |
          Get-ChildItem themes -Filter *.json | Where-Object Name -ne 'schema.json' | ForEach-Object {
            & ./installer/prism.ps1 apply $_.BaseName -DryRun -OutDir "out/ps7/$($_.BaseName)"
          }

      - name: Wygenerowane pliki są poprawne
        shell: pwsh
        run: |
          python -c "import yaml,json,glob,sys
          ys=glob.glob('out/**/glazewm.yaml',recursive=True); js=glob.glob('out/**/*.json',recursive=True); ps=glob.glob('out/**/wallpaper.png',recursive=True)
          assert ys and js and ps, 'brak wygenerowanych plików'
          for f in ys:
              c=yaml.safe_load(open(f,encoding='utf-8')); assert c['window_effects']['focused_window']['border']['color'].startswith('#'), f; assert len(c['keybindings'])>30, f
          for f in js: json.load(open(f,encoding='utf-8-sig' if 'registry' in f else 'utf-8'))
          print('OK:', len(ys), 'yaml,', len(js), 'json,', len(ps), 'png')"

      - uses: actions/upload-artifact@v4
        with:
          name: podglad-motywow
          path: out/

  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Składnia i test generatora komend
        working-directory: apps/terminal
        run: |
          for f in src/*.js src/renderer/renderer.js; do node --check "$f"; done
          node test/commands.test.js | tee wynik.txt
          grep -q "Cześć Ola" wynik.txt
          grep -q "pierwszy X" wynik.txt

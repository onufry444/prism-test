name: Checks

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Themes match the schema
        shell: pwsh
        run: |
          python -m pip install --quiet jsonschema pyyaml
          python -c "import json,glob,jsonschema,sys; s=json.load(open('themes/schema.json',encoding='utf-8')); bad=0
          for f in glob.glob('themes/*.json'):
              if f.endswith('schema.json'): continue
              t=json.load(open(f,encoding='utf-8'))
              for e in jsonschema.Draft7Validator(s).iter_errors(t): print(f'::error file={f}::{e.message}'); bad+=1
              if t.get('id')+'.json'!=f.replace('\\','/').split('/')[-1]: print(f'::error file={f}::id must match the file name'); bad+=1
          sys.exit(bad>0)"

      - name: Dry run of every theme (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Get-ChildItem themes -Filter *.json | Where-Object Name -ne 'schema.json' | ForEach-Object { & .\installer\prism.ps1 apply $_.BaseName -DryRun -OutDir "out\ps5\$($_.BaseName)" }

      - name: Dry run of every theme (PowerShell 7)
        shell: pwsh
        run: |
          Get-ChildItem themes -Filter *.json | Where-Object Name -ne 'schema.json' | ForEach-Object { & ./installer/prism.ps1 apply $_.BaseName -DryRun -OutDir "out/ps7/$($_.BaseName)" }

      - name: Generated files are valid
        shell: pwsh
        run: |
          python -c "import yaml,json,glob
          ys=glob.glob('out/**/glazewm.yaml',recursive=True); js=glob.glob('out/**/*.json',recursive=True); ps=glob.glob('out/**/wallpaper.png',recursive=True)
          assert len(ys)>=4 and js and ps, 'missing generated files'
          for f in ys:
              c=yaml.safe_load(open(f,encoding='utf-8'))
              assert c['window_effects']['focused_window']['border']['color'].startswith('#'), f
              assert len(c['keybindings'])>30, f
              assert any('Prism (Dock|Menu Bar)' in str(m) for m in c['window_rules'][0]['match']), f
          for f in js: json.load(open(f,encoding='utf-8'))
          print('OK:', len(ys), 'yaml,', len(js), 'json,', len(ps), 'png')"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prism shell profile (Windows PowerShell 5.1)
        shell: powershell
        run: |
          node apps/terminal/test/gen-shell.js "$env:RUNNER_TEMP\shell5"
          & .\apps\terminal\test\profile.tests.ps1 -Dir "$env:RUNNER_TEMP\shell5"

      - name: Prism shell profile (PowerShell 7)
        shell: pwsh
        run: |
          node apps/terminal/test/gen-shell.js "$env:RUNNER_TEMP/shell7"
          & ./apps/terminal/test/profile.tests.ps1 -Dir "$env:RUNNER_TEMP/shell7"

      - uses: actions/upload-artifact@v4
        with:
          name: theme-previews
          path: out/

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax, translator and shell tests
        working-directory: apps/terminal
        run: |
          for f in src/*.js src/renderer/*.js test/*.js; do node --check "$f"; done
          node test/translate.test.js
          node test/shells.test.js

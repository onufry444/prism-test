name: App

# Builds Prism on Windows (Server 2025), runs the self-test (window, settings, every shell, translation,
# sudo and "needs admin" through the real elevated helper), then tests install and uninstall.
# A new version in apps/terminal/package.json on main publishes a GitHub release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: apps/terminal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ($env:GITHUB_REF_NAME.TrimStart('v')) --no-git-tag-version --allow-same-version

      - name: Dependencies
        run: npm install --no-audit --no-fund

      - name: Native helper (prism-handoff.exe, makes Prism the default terminal)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
          if not exist native\build mkdir native\build
          cl /nologo /O2 /EHsc /std:c++17 /W3 /DUNICODE /D_UNICODE native\handoff.cpp /Fonative\build\ /Fenative\build\prism-handoff.exe /link ole32.lib oleaut32.lib advapi32.lib user32.lib /SUBSYSTEM:WINDOWS || exit /b 1
          native\build\prism-handoff.exe --version || exit /b 1

      - name: Build
        run: npx electron-builder --win zip --x64 --publish never

      - name: Windows Terminal (its console host passes consoles on to Prism)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Get-AppxPackage -Name Microsoft.WindowsTerminal)) {
            $rel = gh api repos/microsoft/terminal/releases/latest | ConvertFrom-Json
            $kit = $rel.assets | Where-Object name -like '*PreinstallKit.zip' | Select-Object -First 1
            gh release download $rel.tag_name -R microsoft/terminal -p $kit.name -D $env:RUNNER_TEMP
            $dir = Join-Path $env:RUNNER_TEMP 'wt'
            Expand-Archive (Join-Path $env:RUNNER_TEMP $kit.name) -DestinationPath $dir -Force
            $bundle = Get-ChildItem $dir -Filter *.msixbundle | Select-Object -First 1
            $deps = @(Get-ChildItem $dir -Filter *.appx | Where-Object Name -like '*x64*' | ForEach-Object FullName)
            Add-AppxPackage -Path $bundle.FullName -DependencyPath $deps
          }
          Get-AppxPackage -Name Microsoft.WindowsTerminal* | Format-Table Name, Version
          "Session: $((Get-Process -Id $PID).SessionId)"

      - name: Self-test
        env:
          PRISM_TEST_ELEVATE: '1'
          PRISM_TEST_HANDOFF: '1'
          PRISM_TEST_HANDOFF_HKLM: '1'
          PRISM_TEST_REPO: ${{ github.repository }}
        run: |
          $env:PRISM_TEST_HANDOFF_LOG = Join-Path $env:RUNNER_TEMP 'handoff.log'
          $exe = Get-ChildItem dist -Recurse -Filter Prism.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke', "`"$out`"" -PassThru -Wait
          if (Test-Path $out) {
            $r = Get-Content $out -Raw | ConvertFrom-Json
            foreach ($c in $r.checks) {
              if ($c.ok) { Write-Host "OK    $($c.name)" } else { Write-Host "FAIL  $($c.name)"; Write-Host ($c.info | ConvertTo-Json -Depth 5) }
            }
          } else { Write-Host 'No result file' }
          if (Test-Path $env:PRISM_TEST_HANDOFF_LOG) { Write-Host '--- handoff log'; Get-Content $env:PRISM_TEST_HANDOFF_LOG | Select-Object -Last 40 }
          reg delete "HKLM\Software\Classes\CLSID\{682C9CD9-030D-4029-BA37-7DD6F909FDF8}" /f 2>$null
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: One-line install, prism command, uninstall (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PRISM_ZIP = (Resolve-Path dist\Prism-win-x64.zip).Path
          $env:PRISM_NO_LAUNCH = '1'
          Get-Content ..\..\install.ps1 -Raw | Invoke-Expression
          $root = Join-Path $env:LOCALAPPDATA 'Prism'
          foreach ($f in 'app\Prism.exe', 'app\engine\installer\prism.ps1', 'bin\prism.cmd') { if (-not (Test-Path (Join-Path $root $f))) { throw "Missing after install: $f" } }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -notlike "*$root\bin*") { throw 'bin was not added to PATH' }
          $v = & "$root\bin\prism.cmd" version | Out-String
          Write-Host $v
          if ($v -notmatch 'Prism \d+\.\d+') { throw 'prism version does not work' }
          # prism run: opens Prism with the command (Prism picks up and deletes the request file)
          & "$root\bin\prism.cmd" run cmd /c echo hi
          for ($i = 0; $i -lt 60 -and @(Get-ChildItem $env:TEMP -Filter 'prism-run-*.txt').Count; $i++) { Start-Sleep -Milliseconds 500 }
          if (@(Get-ChildItem $env:TEMP -Filter 'prism-run-*.txt').Count) { throw 'prism run: Prism did not pick up the command' }
          Write-Host 'prism run works'
          # update while Prism is running (it was started by prism run): the old version must be replaced cleanly
          if (-not @(Get-Process -Name Prism -ErrorAction SilentlyContinue).Count) { Start-Process "$root\app\Prism.exe"; Start-Sleep -Seconds 6 }
          Get-Content ..\..\install.ps1 -Raw | Invoke-Expression
          if (-not (Test-Path "$root\app\engine\installer\prism.ps1")) { throw 'update over a running Prism broke the install' }
          $left = @(Get-ChildItem $root -Directory | Where-Object { $_.Name -ne 'app' -and $_.Name -like 'app*' }); if ($left.Count) { Write-Host "leftover folders: $($left.Name -join ', ')" }
          Write-Host 'update over a running Prism works'
          # the in-app updater's folder swap, with Prism running
          Start-Process "$root\app\Prism.exe"; Start-Sleep -Seconds 6
          Copy-Item "$root\app" "$root\app.new" -Recurse
          node -e "process.stdout.write(require('./src/updater').SWAP)" | Out-File -Encoding utf8 "$env:RUNNER_TEMP\swap.ps1"
          $work = Join-Path $env:RUNNER_TEMP 'upd-work'; New-Item -ItemType Directory $work -Force | Out-Null
          Get-Process -Name Prism -ErrorAction SilentlyContinue | Stop-Process -Force   # in the app, Prism quits by itself
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\swap.ps1" -Root $root -Work $work -Version 9.9.9
          Write-Host "swap exit code: $LASTEXITCODE"
          $perr = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("$env:RUNNER_TEMP\swap.ps1", [ref]$null, [ref]$perr); if ($perr) { Write-Host "swap.ps1 parse errors: $($perr -join '; ')" }
          if (Test-Path "$root\update.log") { Get-Content "$root\update.log" }
          Get-ChildItem $root | Format-Table Name
          $res = Get-Content "$root\update-result.json" -Raw | ConvertFrom-Json
          Write-Host "swap: $($res.message)"
          if (-not $res.ok) { throw "in-app update swap failed: $($res.message)" }
          if (-not (Test-Path "$root\app\Prism.exe")) { throw 'swap left no Prism' }
          Remove-Item "$root\update-result.json"
          Start-Sleep -Seconds 4
          # uninstall typed inside a Prism tab: hands off to one new window, never loops
          $env:TERM_PROGRAM = 'Prism'
          & "$root\bin\prism.cmd" uninstall -Force
          $env:TERM_PROGRAM = $null
          $peak = 0
          for ($i = 0; $i -lt 40; $i++) {
            $n = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like '*prism.ps1*uninstall*' -or $_.CommandLine -like '*-EncodedCommand*' }).Count
            if ($n -gt $peak) { $peak = $n }
            if (-not (Test-Path "$root\app") -and $n -eq 0) { break }
            Start-Sleep -Milliseconds 500
          }
          Write-Host "uninstall processes at peak: $peak"
          if ($peak -gt 1) { throw "uninstall started $peak processes" }
          if (Test-Path "$root\app") { throw 'uninstall did not remove the app' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*$root\bin*") { throw 'bin is still on PATH' }
          Write-Host 'Install, prism command and uninstall work.'

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-win-x64
          path: apps/terminal/dist/Prism-win-x64.zip

      - name: GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version }
          gh release view $v --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $v already exists."; exit 0 }
          gh release create $v dist/Prism-win-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Prism $v" --notes-file ../../.github/release-notes.md
          Write-Host "Published $v"

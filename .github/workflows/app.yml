name: App

# Builds Prism on Windows 11 (Server 2025), applies a real theme with GlazeWM, runs the self-test
# (window, settings, shells, translation, dock, menu bar, workspaces), then tests install and uninstall.
# A new version in apps/terminal/package.json on main publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: apps/terminal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ($env:GITHUB_REF_NAME.TrimStart('v')) --no-git-tag-version --allow-same-version

      - name: Dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx electron-builder --win zip --x64 --publish never

      - name: Apply a real theme (tiling with GlazeWM)
        run: |
          & ..\..\installer\prism.ps1 apply tiles
          Start-Sleep -Seconds 6
          if (-not (Get-Process -Name glazewm -ErrorAction SilentlyContinue)) { throw 'GlazeWM is not running' }
          $cli = Get-ChildItem 'C:\Program Files\glzr.io' -Recurse -Filter glazewm.exe -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'cli' } | Select-Object -First 1
          $q = (& $cli.FullName query workspaces) | Out-String
          Write-Host $q
          if ($q -notmatch '"success":\s*true') { throw 'GlazeWM does not answer (config not loaded?)' }
          & ..\..\installer\prism.ps1 status

      - name: Self-test
        env:
          PRISM_EXPECT_GLAZE: '1'
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter Prism.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke', "`"$out`"" -PassThru -Wait
          if (Test-Path $out) {
            $r = Get-Content $out -Raw | ConvertFrom-Json
            foreach ($c in $r.checks) {
              if ($c.ok) { Write-Host "OK    $($c.name)" } else { Write-Host "FAIL  $($c.name)"; Write-Host ($c.info | ConvertTo-Json -Depth 5) }
            }
          } else { Write-Host 'No result file' }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Restore the runner's original look
        if: always()
        run: '& ..\..\installer\prism.ps1 restore'

      - name: One-line install, prism command, uninstall (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PRISM_ZIP = (Resolve-Path dist\Prism-win-x64.zip).Path
          $env:PRISM_NO_LAUNCH = '1'
          Get-Content ..\..\install.ps1 -Raw | Invoke-Expression
          $root = Join-Path $env:LOCALAPPDATA 'Prism'
          foreach ($f in 'app\Prism.exe', 'app\engine\installer\prism.ps1', 'app\engine\themes\tiles.json', 'bin\prism.cmd') { if (-not (Test-Path (Join-Path $root $f))) { throw "Missing after install: $f" } }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -notlike "*$root\bin*") { throw 'bin was not added to PATH' }
          $list = & "$root\bin\prism.cmd" list | Out-String
          Write-Host $list
          if ($list -notmatch 'tiles' -or $list -notmatch 'glass') { throw 'prism list shows no themes' }
          & "$root\bin\prism.cmd" apply glass -DryRun -OutDir "$env:RUNNER_TEMP\dry"
          if (-not (Test-Path "$env:RUNNER_TEMP\dry\wallpaper.png")) { throw 'dry run produced no files' }
          # uninstall typed inside a Prism tab: hands off to one new window, never loops
          $env:TERM_PROGRAM = 'Prism'
          & "$root\bin\prism.cmd" uninstall -Force
          $env:TERM_PROGRAM = $null
          $peak = 0
          for ($i = 0; $i -lt 40; $i++) {
            $n = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -like '*prism.ps1*uninstall*' }).Count
            if ($n -gt $peak) { $peak = $n }
            if (-not (Test-Path "$root\app") -and $n -eq 0) { break }
            Start-Sleep -Milliseconds 500
          }
          Write-Host "uninstall processes at peak: $peak"
          if ($peak -gt 1) { throw "uninstall started $peak processes" }
          if (Test-Path "$root\app") { throw 'uninstall did not remove the app' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*$root\bin*") { throw 'bin is still on PATH' }
          Write-Host 'Install, prism command and uninstall work.'

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-win-x64
          path: apps/terminal/dist/Prism-win-x64.zip

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version }
          gh release view $v --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $v already exists."; exit 0 }
          gh release create $v dist/Prism-win-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Prism $v" --notes-file ../../.github/release-notes.md
          Write-Host "Published $v"
